[package]
name = "flextunnel-core"
version.workspace = true
edition.workspace = true
description.workspace = true

[lib]
name = "flextunnel_core"
crate-type = ["rlib"]

[dependencies]
anyhow.workspace = true
askama.workspace = true
base64.workspace = true
dirs.workspace = true
env_logger.workspace = true
futures.workspace = true
hickory-resolver.workspace = true
ipnetwork.workspace = true
iroh.workspace = true
log.workspace = true
n0-future.workspace = true
rand.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# iroh's mDNS discovery sends raw UDP multicast, which iOS rejects without the
# com.apple.developer.networking.multicast entitlement, so it is compiled out.
[target.'cfg(not(target_os = "ios"))'.dependencies]
iroh-mdns-address-lookup.workspace = true

[dev-dependencies]
tempfile.workspace = true
